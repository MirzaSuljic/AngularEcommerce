spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/full-stack-ecommerce?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=ecommerceapp
spring.datasource.password=ecommerceapp
spring.jpa.hibernate.ddl-auto=update
# Hibernate 7 detects the MySQL dialect automatically (MySQL8Dialect no longer exists)

spring.data.rest.base-path=/api

# secret used to sign the JWTs issued by POST /api/login (use at least 32 characters, change it!)
app.jwt.secret=change-me-to-a-long-random-secret-of-32-chars-or-more

# include the reason (e.g. "Username is already taken") in JSON error responses
server.error.include-message=always


# uploaded product images (Admin -> Products -> Upload image) are saved here and served at /uploads/**
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
