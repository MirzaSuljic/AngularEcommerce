# ---------- database: PostgreSQL on Neon ----------
# Locally the values come from backend/env.properties or backend/.env (both not in git, see .env.example),
# on Render from the service's Environment variables.
# (ECOMMERCE_ prefix: a DB_URL left over from another project on the same PC would win over env.properties)
spring.config.import=optional:file:env.properties,optional:file:.env[.properties]
spring.datasource.url=${ECOMMERCE_DB_URL}
spring.datasource.username=${ECOMMERCE_DB_USERNAME}
spring.datasource.password=${ECOMMERCE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# demo catalog (data-dev.sql) is loaded once when the database is empty (DemoDataSeeder)
app.seed-demo-data=${SEED_DEMO_DATA:true}

spring.data.rest.base-path=/api

# ---------- server ----------
# Render tells the app which port to use
server.port=${PORT:8080}
# behind Render's proxy: build https:// links (e.g. uploaded image URLs) from X-Forwarded-* headers
server.forward-headers-strategy=framework
# include the reason (e.g. "Username is already taken") in JSON error responses
server.error.include-message=always

# ---------- security ----------
# secret used to sign the JWTs issued by POST /api/login (at least 32 characters; set JWT_SECRET in production!)
app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-of-32-chars-or-more}
# frontends allowed to call the API, comma separated (e.g. https://luv2shop.netlify.app)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ---------- uploads ----------
# uploaded product images (Admin -> Products -> Upload image) are saved here and served at /uploads/**
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
