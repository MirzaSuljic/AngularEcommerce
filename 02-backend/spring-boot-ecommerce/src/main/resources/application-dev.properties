# Run without PostgreSQL:  .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=dev"
# Uses an in-memory H2 database that is filled from data-dev.sql on every start.
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:ecommerce;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
# run data-dev.sql after Hibernate has created the tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-dev.sql
spring.sql.init.encoding=UTF-8
