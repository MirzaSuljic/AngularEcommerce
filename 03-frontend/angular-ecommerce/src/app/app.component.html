<div class="flex min-h-screen flex-col">

    <div class="page flex flex-wrap items-center gap-x-6 gap-y-3 py-4">
      <a
        routerLink="/products"
        class="font-display text-2xl font-extrabold tracking-tight text-pine"
        aria-label="luv2shop home"
      >
        luv2shop
      </a>

      <app-search class="order-last w-full sm:order-none sm:w-auto sm:flex-1" />

      <div class="ml-auto flex items-center gap-2 sm:ml-0">
        <app-login-status />
        <app-cart-status />

  <main class="flex-1">

        <span class="font-display font-bold text-pine">luv2shop</span>

      </p>
      <nav class="flex gap-5" aria-label="Footer">
        <a routerLink="/about" class="hover:text-pine">About</a>
        <a routerLink="/contact" class="hover:text-pine">Contact</a>
        <a routerLink="/members" class="hover:text-pine">Members</a>
      </nav>
