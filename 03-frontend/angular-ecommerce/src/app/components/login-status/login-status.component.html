@if (user) {
  <div class="flex items-center gap-1">
    <span class="hidden px-2 text-sm text-ink-soft md:inline">Hi, {{ user.name }}</span>
    @if (isAdmin) {
      <a routerLink="/admin" class="btn-ghost">Admin</a>
    }
    <a routerLink="/members" class="btn-ghost">Members</a>
    <button type="button" (click)="logout()" class="btn-ghost">Log out</button>
  </div>
} @else {
  <a routerLink="/login" class="btn-ghost">Log in</a>
}
